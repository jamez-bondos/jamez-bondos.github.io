name: Build and deploy Hugo

on:
  push:
    branches:
      - main
    paths:
      - "archetypes/**"
      - "assets/**"
      - "content/**"
      - "data/**"
      - "i18n/**"
      - "layouts/**"
      - "static/**"
      - "themes/**"
      - ".gitmodules"
      - "hugo.yaml"
      - "hugo.yml"
      - "hugo.toml"
      - "config/**"
      - ".github/workflows/deploy-hugo.yml"
  repository_dispatch:
    types:
      - content-updated
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  HUGO_VERSION: 0.164.0
  HUGO_ENVIRONMENT: production
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout site repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Resolve content revision
        id: content-ref
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          CONTENT_REPOSITORY: ${{ github.event.client_payload.content_repository }}
          CONTENT_SHA: ${{ github.event.client_payload.content_sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "repository_dispatch" ]]; then
            if [[ "${CONTENT_REPOSITORY}" != "jamez-bondos/blog-content" ]]; then
              echo "::error::Unexpected content repository"
              exit 1
            fi
            if [[ ! "${CONTENT_SHA}" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "::error::content_sha must be a 40-character commit SHA"
              exit 1
            fi
            echo "ref=${CONTENT_SHA}" >> "${GITHUB_OUTPUT}"
            echo "verify_sha=true" >> "${GITHUB_OUTPUT}"
          else
            echo "ref=main" >> "${GITHUB_OUTPUT}"
            echo "verify_sha=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Check content repository credential
        shell: bash
        env:
          CONTENT_REPO_TOKEN: ${{ secrets.CONTENT_REPO_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${CONTENT_REPO_TOKEN}" ]]; then
            echo "::error::CONTENT_REPO_TOKEN is not configured"
            exit 1
          fi

      - name: Checkout content repository
        uses: actions/checkout@v7
        with:
          repository: jamez-bondos/blog-content
          ref: ${{ steps.content-ref.outputs.ref }}
          path: _content
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Validate content repository
        shell: bash
        env:
          EXPECTED_REF: ${{ steps.content-ref.outputs.ref }}
          VERIFY_SHA: ${{ steps.content-ref.outputs.verify_sha }}
        run: |
          set -euo pipefail

          if [[ ! -d "_content/content/posts" ]]; then
            echo "::error::Private content directory content/posts does not exist"
            exit 1
          fi

          if find "_content/content/posts" -type l -print -quit | grep -q .; then
            echo "::error::Symlinks are not allowed in private post bundles"
            exit 1
          fi

          while IFS= read -r article; do
            relative="${article#_content/content/posts/}"
            if [[ ! "${relative}" =~ ^[^/]+/index\.(md|markdown)$ ]]; then
              echo "::error file=${article}::Articles must use content/posts/<slug>/index.md Page Bundles"
              exit 1
            fi
          done < <(find "_content/content/posts" -type f \( -name "*.md" -o -name "*.markdown" \) -print)

          actual_sha="$(git -C _content rev-parse HEAD)"
          if [[ "${VERIFY_SHA}" == "true" && "${actual_sha}" != "${EXPECTED_REF,,}" ]]; then
            echo "::error::Checked-out content commit does not match the dispatched SHA"
            exit 1
          fi
          echo "Content commit: ${actual_sha}"

      - name: Assemble production content
        shell: bash
        run: |
          set -euo pipefail

          if [[ -e "_build-content" ]]; then
            echo "::error::_build-content must not exist before assembly"
            exit 1
          fi

          mkdir -p "_build-content/posts"
          rsync -a \
            --exclude "posts/dev-*" \
            "content/" \
            "_build-content/"
          rsync -a \
            "_content/content/posts/" \
            "_build-content/posts/"

          if find "_build-content/posts" -mindepth 1 -maxdepth 1 -name "dev-*" -print -quit | grep -q .; then
            echo "::error::Development fixtures leaked into production content"
            exit 1
          fi

      - name: Setup GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install Hugo
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -o "${RUNNER_TEMP}/hugo.tar.gz" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_${HUGO_VERSION}_linux-amd64.tar.gz"
          sudo tar \
            -C /usr/local/bin \
            -xzf "${RUNNER_TEMP}/hugo.tar.gz" \
            hugo
          hugo version

      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          hugo \
            --contentDir "_build-content" \
            --baseURL "${{ steps.pages.outputs.base_url }}/" \
            --cacheDir "${RUNNER_TEMP}/hugo_cache" \
            --gc \
            --minify

      - name: Validate Pages artifact
        shell: bash
        run: |
          set -euo pipefail

          for required_file in \
            "public/index.html" \
            "public/search/index.html" \
            "public/index.json"; do
            if [[ ! -f "${required_file}" ]]; then
              echo "::error::Missing required Pages artifact: ${required_file}"
              exit 1
            fi
          done

          if find "public" -path "*posts/dev-*" -print -quit | grep -q .; then
            echo "::error::Development post output exists in the Pages artifact"
            exit 1
          fi

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
